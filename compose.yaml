services:

  postgres:
    image: postgres:16-alpine
    container_name: paisabachat_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: paisabachat_db
      POSTGRES_USER: paisabachat_user
      POSTGRES_PASSWORD: paisabachat_pass
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    ports:
      - "5432:5432"

    volumes:
      - paisabachat_postgres_data:/var/lib/postgresql/data

    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paisabachat_user -d paisabachat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: paisabachat_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - paisabachat_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  paisabachat_postgres_data:
  paisabachat_redis_data: